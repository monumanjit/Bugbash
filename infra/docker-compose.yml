version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ramba_qms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ../backend
    env_file:
      - ../backend/.env.example
    depends_on:
      - postgres
    ports:
      - '4000:4000'

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  pgdata:
